[project]
name = "llamaindex-rag"
version = "0.1.0"
description = "A local RAG system for document Q&A using ChromaDB and Gemini."
authors = [
    {name = "falltwo", email = "gjui890@outlook.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "chromadb>=1.4.0",
    "google-genai>=1.56.0",
    "langchain-community>=0.4.1",
    "langchain-text-splitters>=1.1.0",
    "python-dotenv>=1.2.1",
    "sentence-transformers>=2.7.0",
    "torch>=2.9.1",
    "transformers>=4.51.0",
]
